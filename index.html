<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter 81</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Chapter 81">
    <link rel="apple-touch-icon" href="c81.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffffff;
            --mint-box: #3d405b;       /* Deep Indigo Blue */
            --text-dark: #f4f1de;      /* Vintage Cream */
            --chapter-white: #ffffff;  /* Pure White for Chapter */
            --lime-eighty: #f7ce14;    /* Yellow for 81, Paragraph, and TOC Numbers */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #e8ede9;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Outer Magazine Canvas matching exact proportions */
        .magazine-cover {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 600px;
            background-color: var(--bg-color);
            border: 1px solid #d4dcdc;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            overflow: hidden;
            padding: 16px 20px 20px 20px;
        }

        /* Fullscreen Menu Overlay matched to header color */
        .fullscreen-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--mint-box);
            z-index: 1; /* Hidden behind cover content initially */
            display: flex;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 24px 20px;
        }

        .fullscreen-menu.active {
            z-index: 20; /* Pops to the front when active */
            opacity: 1;
            pointer-events: auto;
        }

        /* Vertical Table of Contents Header on the right (White) */
        .toc-vertical-title {
            position: absolute;
            top: 25px;
            right: 15px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1.5rem;
            font-weight: 500;
            letter-spacing: 6px;
            color: #ffffff; /* Pure white */
            writing-mode: vertical-rl;
            text-orientation: mixed;
            text-transform: uppercase;
            line-height: 1;
        }

        /* Left Side List Area optimized to fit 6 items perfectly without scrolling */
        .toc-content-area {
            position: absolute;
            top: 75px;
            bottom: 20px;
            left: 20px;
            right: 60px;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
        }

        .toc-item {
            display: flex;
            align-items: center;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .toc-item:hover {
            opacity: 0.75;
        }

        .toc-number {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.6rem;
            font-weight: 400;
            color: var(--lime-eighty); /* #f7ce14 */
            line-height: 0.9;
            min-width: 32px;
            text-align: right;
            margin-right: 12px;
        }

        .toc-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            color: #ffffff;
            text-transform: uppercase;
            line-height: 1.2;
        }

        /* Back Button inside the Fullscreen Menu (placed at top-left) */
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.6rem;
            letter-spacing: 2px;
            font-weight: 600;
            color: var(--text-dark);
            text-transform: uppercase;
            transition: opacity 0.2s;
        }

        .back-btn:hover {
            opacity: 0.6;
        }

        /* 1. Top Mint Background Banner Header */
        .top-mint-banner {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 140px;
            background-color: var(--mint-box);
            z-index: 2;
            padding: 14px 22px 0 22px;
        }

        .top-banner-text {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.6rem;
            letter-spacing: 2px;
            font-weight: 500;
            color: var(--text-dark);
            text-transform: uppercase;
        }

        .banner-line {
            width: 100%;
            height: 1px;
            background-color: #555877;
            margin-top: 6px;
        }

        /* Text Menu Button Styling */
        .menu-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.6rem;
            letter-spacing: 2px;
            font-weight: 500;
            color: var(--text-dark);
            text-transform: uppercase;
            padding: 0;
            transition: opacity 0.2s;
        }

        .menu-btn:hover {
            opacity: 0.7;
        }

        /* CHAPTER Title container */
        .chapter-container {
            position: absolute;
            top: 50px;
            left: 20px;
            z-index: 3;
        }

        .chapter-heading {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3.4rem;
            font-weight: 400;
            color: var(--chapter-white); /* Pure white */
            line-height: 0.9;
            letter-spacing: 0px;
            text-transform: uppercase;
        }

        /* Image Container */
        .olive-container {
            position: absolute;
            top: 135px;
            left: 125px;
            right: 20px;
            z-index: 4;
        }

        .olive-rectangle {
            width: 100%;
            height: 395px;
            overflow: hidden;
        }

        .olive-rectangle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Number 81 container positioned on the boundary */
        .eighty-one-container {
            position: absolute;
            top: 100px;
            left: 20px;
            width: 90px;
            z-index: 6;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .number-eighty-one {
            font-family: 'Cormorant Garamond', serif;
            font-size: 6.2rem;
            font-weight: 400;
            color: var(--lime-eighty); /* #f7ce14 */
            line-height: 0.85;
            text-align: center;
        }

        .vertical-line {
            width: 1px;
            height: 220px;
            background-color: #d1ccb6;
            margin: 12px 0 0 0;
        }

        /* 3. Bottom Section: Mint Box & Paragraph Text */
        .bottom-section {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            z-index: 5;
            display: grid;
            grid-template-columns: 85px 1fr;
            gap: 12px;
            align-items: flex-end;
        }

        .mint-bottom-box {
            background-color: var(--mint-box);
            padding: 10px 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            height: 75px;
        }

        .mint-bottom-box .num-ten {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-dark);
            line-height: 1;
            letter-spacing: 0.5px;
        }

        .lorem-paragraph {
            font-size: 0.53rem;
            line-height: 1.45;
            color: var(--lime-eighty);
            font-weight: 500;
            padding-bottom: 2px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="magazine-cover">
        <nav class="fullscreen-menu" id="fullscreenMenu">
            <button class="back-btn" onclick="toggleMenu()">← Back</button>
            
            <div class="toc-vertical-title">Table of Contents</div>

            <div class="toc-content-area">
                <a href="#" class="toc-item" onclick="toggleMenu()">
                    <span class="toc-number">1</span>
                    <span class="toc-title">Bio</span>
                </a>
                <a href="#" class="toc-item" onclick="toggleMenu()">
                    <span class="toc-number">2</span>
                    <span class="toc-title">Blog</span>
                </a>
                <a href="#" class="toc-item" onclick="toggleMenu()">
                    <span class="toc-number">3</span>
                    <span class="toc-title">Email</span>
                </a>
                <a href="#" class="toc-item" onclick="toggleMenu()">
                    <span class="toc-number">4</span>
                    <span class="toc-title">Instagram</span>
                </a>
                <a href="#" class="toc-item" onclick="toggleMenu()">
                    <span class="toc-number">5</span>
                    <span class="toc-title">Resources</span>
                </a>
                <a href="#" class="toc-item" onclick="toggleMenu()">
                    <span class="toc-number">6</span>
                    <span class="toc-title">Seed to Harvest</span>
                </a>
            </div>
        </nav>

        <div class="top-mint-banner">
            <div class="top-banner-text">
                <span>VOLUME I</span>
                <button class="menu-btn" onclick="toggleMenu()" aria-label="Toggle Menu">
                    MENU
                </button>
            </div>
            <div class="banner-line"></div>
        </div>

        <div class="chapter-container">
            <h1 class="chapter-heading">CHAPTER</h1>
        </div>

        <div class="olive-container">
            <div class="olive-rectangle">
                <img src="red hibi.jpg" alt="Red Hibiscus">
            </div>
        </div>

        <div class="eighty-one-container">
            <div class="number-eighty-one">81</div>
            <div class="vertical-line"></div>
        </div>

        <div class="bottom-section">
            <div class="mint-bottom-box">
                <span class="num-ten">EST. 2026</span>
            </div>
            <p class="lorem-paragraph">
                Rooted in ancient traditions and modern reflection. Discover timeless remedies, stories of daily life, and the hidden histories that shape our understanding of growth.
            </p>
        </div>
    </div>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('fullscreenMenu');
            menu.classList.toggle('active');
        }

        // Register Service Worker for PWA functionality
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registered!', reg))
                    .catch(err => console.log('Service Worker registration failed: ', err));
            });
        }
    </script>

</body>
</html>
