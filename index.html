<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chapter 81</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Chapter 81">
    <link rel="apple-touch-icon" href="c81.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffffff;
            --mint-box: #3d405b;      /* Deep Indigo Blue */
            --text-dark: #f4f1de;      /* Vintage Cream */
            --chapter-white: #ffffff;  /* Pure White for Chapter */
            --lime-eighty: #f7ce14;    /* Yellow for 81, Paragraph, and TOC Numbers */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Montserrat', sans-serif;
            width: 100vw;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .magazine-cover {
            position: relative;
            width: 100vw;
            height: 100dvh;
            background-color: var(--bg-color);
            overflow: hidden;
            padding: 14px 16px 16px 16px;
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 421px) {
            .magazine-cover {
                max-width: 420px;
                height: 85vh;
                max-height: 750px;
                border: 1px solid #d4dcdc;
                box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            }
        }

        /* Fullscreen Menu Overlay */
        .fullscreen-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--mint-box);
            z-index: 1;
            display: flex;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 24px 20px;
        }

        .fullscreen-menu.active {
            z-index: 20;
            opacity: 1;
            pointer-events: auto;
        }

        .toc-vertical-title {
            position: absolute;
            top: 30px;
            right: 20px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1.4rem;
            font-weight: 500;
            letter-spacing: 6px;
            color: #ffffff;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            text-transform: uppercase;
            line-height: 1;
        }

        .toc-content-area {
            position: absolute;
            top: 80px;
            bottom: 30px;
            left: 24px;
            right: 70px;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
        }

        .toc-item {
            display: flex;
            align-items: center;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .toc-item:hover {
            opacity: 0.75;
        }

        .toc-number {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            font-weight: 400;
            color: var(--lime-eighty);
            line-height: 0.9;
            min-width: 35px;
            text-align: right;
            margin-right: 14px;
        }

        .toc-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 2px;
            color: #ffffff;
            text-transform: uppercase;
        }

        .back-btn {
            position: absolute;
            top: 24px;
            left: 24px;
            background: none;
            border: none;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.65rem;
            letter-spacing: 2px;
            font-weight: 600;
            color: var(--text-dark);
            text-transform: uppercase;
            transition: opacity 0.2s;
        }

        .back-btn:hover {
            opacity: 0.6;
        }

        /* Locked Top Mint Banner Header */
        .top-mint-banner {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 165px;
            background-color: var(--mint-box);
            z-index: 2;
            padding: 16px 20px 0 20px;
        }

        .top-banner-text {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.6rem;
            letter-spacing: 2px;
            font-weight: 500;
            color: var(--text-dark);
            text-transform: uppercase;
        }

        .banner-line {
            width: 100%;
            height: 1px;
            background-color: #555877;
            margin-top: 6px;
        }

        .menu-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.6rem;
            letter-spacing: 2px;
            font-weight: 500;
            color: var(--text-dark);
            text-transform: uppercase;
            padding: 0;
            transition: opacity 0.2s;
        }

        .menu-btn:hover {
            opacity: 0.7;
        }

        /* CHAPTER Title */
        .chapter-container {
            position: absolute;
            top: 52px;
            left: 20px;
            z-index: 3;
        }

        .chapter-heading {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3.4rem;
            font-weight: 400;
            color: var(--chapter-white);
            line-height: 0.9;
            text-transform: uppercase;
        }

        /* Widened & Locked Flower Picture (expanded left to 80px & right to 16px to show full petals) */
        .olive-container {
            position: absolute;
            top: 145px;
            left: 80px;  /* Widened horizontally */
            right: 16px; /* Pushed further out to reveal petals */
            bottom: 95px;
            z-index: 4;
        }

        .olive-rectangle {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .olive-rectangle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        /* Locked '81' Positioned over boundary & higher z-index overlay */
        .eighty-one-container {
            position: absolute;
            top: 120px; /* Locked right through center waist of 8 */
            left: 20px;
            width: 85px;
            bottom: 95px;
            z-index: 6; /* Sits above image layer */
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
        }

        .number-eighty-one {
            font-family: 'Cormorant Garamond', serif;
            font-size: 7.2rem;
            font-weight: 400;
            color: var(--lime-eighty);
            line-height: 0.8;
            text-align: center;
        }

        .vertical-line {
            width: 1px;
            flex-grow: 1;
            background-color: #d1ccb6;
            margin: 12px 0 0 0;
        }

        /* Locked Bottom Paragraph Section */
        .bottom-section {
            position: absolute;
            bottom: 12px;
            left: 16px;
            right: 16px;
            height: 70px;
            z-index: 5;
            display: grid;
            grid-template-columns: 80px 1fr;
            gap: 10px;
            align-items: center;
        }

        .mint-bottom-box {
            background-color: var(--mint-box);
            padding: 8px 6px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            height: 100%;
        }

        .mint-bottom-box .num-ten {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-dark);
            line-height: 1;
            letter-spacing: 0.5px;
        }

        .lorem-paragraph {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            justify-content: center;
            gap: 3px;
            height: 100%;
        }

        .lorem-paragraph span {
            font-size: 0.52rem;
            line-height: 1.25;
            color: var(--lime-eighty);
            font-weight: 500;
            white-space: nowrap; /* Keeps line layout strictly locked */
        }
    </style>
</head>
<body>

    <div class="magazine-cover">
        <nav class="fullscreen-menu" id="fullscreenMenu">
            <button class="back-btn" onclick="toggleMenu()">← Back</button>
            
            <div class="toc-vertical-title">Table of Contents</div>

            <div class="toc-content-area">
                <a href="#" class="toc-item" onclick="toggleMenu()">
                    <span class="toc-number">1</span>
                    <span class="toc-title">Bio</span>
                </a>
                <a href="#" class="toc-item" onclick="toggleMenu()">
                    <span class="toc-number">2</span>
                    <span class="toc-title">Blog</span>
                </a>
                <a href="#" class="toc-item" onclick="toggleMenu()">
                    <span class="toc-number">3</span>
                    <span class="toc-title">Email</span>
                </a>
                <a href="#" class="toc-item" onclick="toggleMenu()">
                    <span class="toc-number">4</span>
                    <span class="toc-title">Instagram</span>
                </a>
                <a href="#" class="toc-item" onclick="toggleMenu()">
                    <span class="toc-number">5</span>
                    <span class="toc-title">Resources</span>
                </a>
                <a href="#" class="toc-item" onclick="toggleMenu()">
                    <span class="toc-number">6</span>
                    <span class="toc-title">Seed to Harvest</span>
                </a>
            </div>
        </nav>

        <div class="top-mint-banner">
            <div class="top-banner-text">
                <span>VOLUME I</span>
                <button class="menu-btn" onclick="toggleMenu()" aria-label="Toggle Menu">
                    MENU
                </button>
            </div>
            <div class="banner-line"></div>
        </div>

        <div class="chapter-container">
            <h1 class="chapter-heading">CHAPTER</h1>
        </div>

        <div class="olive-container">
            <div class="olive-rectangle">
                <img src="red hibi.jpg" alt="Red Hibiscus">
            </div>
        </div>

        <div class="eighty-one-container">
            <div class="number-eighty-one">81</div>
            <div class="vertical-line"></div>
        </div>

        <div class="bottom-section">
            <div class="mint-bottom-box">
                <span class="num-ten">EST. 2026</span>
            </div>
            <div class="lorem-paragraph">
                <span>Rooted in ancient traditions and modern reflection.</span>
                <span>Discover timeless remedies, stories of daily life,</span>
                <span>and the hidden histories that shape our understanding of growth.</span>
            </div>
        </div>
    </div>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('fullscreenMenu');
            menu.classList.toggle('active');
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registered!', reg))
                    .catch(err => console.log('Service Worker registration failed: ', err));
            });
        }
    </script>
</body>
</html>
